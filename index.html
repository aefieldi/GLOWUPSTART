@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700;1,900&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root {
  --bg: #10172e;
  --bg-2: #161e3a;
  --bg-3: #0a1024;
  --ink: #f5f0ff;
  --ink-soft: rgba(245,240,255,0.78);
  --ink-faint: rgba(245,240,255,0.5);
  --pink: #ff6bc1;
  --pink-2: #ff8ad1;
  --purple: #b26bff;
  --purple-2: #c78fff;
  --cyan: #6bd5ff;
  --mint: #8effd5;
  --lime: #d4ff00;
  --cream: #f8f3ec;
  --cream-2: #fdfaf4;
  --ink-dark: #1a1530;
  --holo: linear-gradient(135deg,#c78fff 0%,#ff8ad1 50%,#8effd5 100%);
  --holo-2: linear-gradient(135deg,#ff6bc1,#b26bff,#6bd5ff);
  --card: rgba(255,255,255,0.04);
  --card-2: rgba(255,255,255,0.06);
  --border: rgba(178,107,255,0.22);
  --border-strong: rgba(178,107,255,0.4);
}

.app{
  font-family:'Nunito',sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
  position:relative;
}

.app::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 15% 0%, rgba(255,107,193,0.12) 0%, transparent 45%),
    radial-gradient(ellipse at 85% 0%, rgba(107,213,255,0.10) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 100%, rgba(178,107,255,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 80%, rgba(107,140,255,0.08) 0%, transparent 45%);
  pointer-events:none;
  z-index:0;
  animation:aurora 25s ease-in-out infinite alternate;
}

.app::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(178,107,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(178,107,255,0.04) 1px, transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
  z-index:0;
}
@keyframes aurora{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-8px,12px) scale(1.03)}
  100%{transform:translate(8px,-8px) scale(1)}
}

.stars-bg{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.s-star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:0 0 6px 1px rgba(255,255,255,0.9);animation:twinkle 4s ease-in-out infinite}
.s-star.lg{width:3px;height:3px;box-shadow:0 0 10px 2px rgba(255,200,255,0.9)}
.s-star.pink{background:#ff6bc1;box-shadow:0 0 8px 2px rgba(255,107,193,0.7)}
.s-star.cyan{background:#6bd5ff;box-shadow:0 0 8px 2px rgba(107,213,255,0.7)}
.s-star.mint{background:#8effd5;box-shadow:0 0 8px 2px rgba(142,255,213,0.6)}
@keyframes twinkle{
  0%,100%{opacity:0.15;transform:scale(0.8)}
  50%{opacity:0.9;transform:scale(1.3)}
}

/* ======== Celebration sparkles ======== */
.celebration{position:fixed;inset:0;pointer-events:none;z-index:200}
.celeb-spark{
  position:absolute;width:6px;height:6px;border-radius:50%;
  background:var(--holo);
  box-shadow:0 0 16px 4px rgba(255,138,209,0.9);
  animation:celeb-burst 1.5s cubic-bezier(.25,.9,.3,1) forwards;
}
@keyframes celeb-burst{
  0%{opacity:0;transform:scale(0) rotate(0) translateY(0)}
  20%{opacity:1;transform:scale(1.4) rotate(180deg) translateY(-40px)}
  100%{opacity:0;transform:scale(0.5) rotate(720deg) translateY(-220px)}
}

/* ======== Reveal animation ======== */
.reveal{
  opacity:0;
  animation:fadeup 0.55s cubic-bezier(.25,.9,.3,1) forwards;
}
@keyframes fadeup{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

/* ======== Top Bar ======== */
.topbar{
  background:linear-gradient(135deg, rgba(255,107,193,0.12) 0%, rgba(178,107,255,0.15) 50%, rgba(107,213,255,0.12) 100%);
  backdrop-filter:blur(12px);
  padding:0 24px;
  height:62px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
  border-bottom:1px solid var(--border);
  position:relative;z-index:10;
}
.topbar::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);pointer-events:none}
.topbar-left{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.topbar-icon{
  width:38px;height:38px;border-radius:12px;background:var(--holo);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;
  box-shadow:0 4px 16px rgba(178,107,255,0.4),inset 0 1px 0 rgba(255,255,255,0.3);
}
.topbar-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:17px;color:var(--ink);letter-spacing:0.2px}
.topbar-title em{font-style:italic;background:var(--holo);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar-nav{display:flex;gap:28px;position:relative;z-index:1}
.topbar-link{font-size:12px;color:var(--ink-faint);text-decoration:none;padding:20px 0;border-bottom:2px solid transparent;transition:all .15s;cursor:default;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.topbar-link.active{color:var(--ink);border-bottom-color:var(--pink)}
.mobile-toggle{display:none;background:none;border:none;color:var(--ink);font-size:22px;cursor:pointer;padding:4px}

/* ======== Layout ======== */
.layout{flex:1;display:flex;overflow:hidden;position:relative;z-index:2}

/* ======== Sidebar ======== */
.sidebar{
  width:300px;min-width:300px;
  background:rgba(13,9,34,0.6);
  backdrop-filter:blur(14px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.side-header{
  padding:24px 22px 20px;
  background:linear-gradient(180deg, rgba(178,107,255,0.08) 0%, transparent 100%);
  border-bottom:1px solid var(--border);
}
.side-eyebrow{
  font-family:'DM Mono',monospace;
  font-size:9px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--pink);margin-bottom:8px;font-weight:500;
}
.side-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin-bottom:16px;line-height:1.35}
.side-prog-row{display:flex;align-items:center;gap:10px}
.side-prog-bg{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:100px;overflow:hidden;position:relative}
.side-prog-fill{
  height:100%;
  background:var(--holo);
  border-radius:100px;
  transition:width .5s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 0 12px rgba(178,107,255,0.5);
  position:relative;
}
.side-prog-fill.shimmer::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent);
  animation:shimmer-pass 1.4s ease;
}
@keyframes shimmer-pass{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}
.side-prog-pct{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--ink-soft);min-width:34px;text-align:right}

.side-list{flex:1;overflow-y:auto;padding:12px 12px 24px}
.side-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-radius:12px;
  cursor:pointer;transition:all .15s;margin-bottom:3px;position:relative;
}
.side-item:hover{background:rgba(255,255,255,0.04)}
.side-item.active{
  background:linear-gradient(135deg, rgba(255,107,193,0.12), rgba(178,107,255,0.12));
  border:1px solid var(--border);
}
.side-item-emoji{font-size:14px;flex-shrink:0;opacity:0.85}
.side-item-title{flex:1;font-size:13px;color:var(--ink-soft);font-weight:500;line-height:1.35}
.side-item.active .side-item-title{color:var(--ink);font-weight:700}
.side-check{
  width:22px;height:22px;min-width:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .25s;
}
.side-check.pending{border:2px solid rgba(178,107,255,0.35)}
.side-check.done{
  background:var(--holo);border:none;
  box-shadow:0 2px 12px rgba(255,107,193,0.5), 0 0 20px rgba(178,107,255,0.3);
  animation:check-pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes check-pop{
  0%{transform:scale(0.7)}
  60%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

/* ======== Main ======== */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.main-inner{max-width:820px;padding:36px 44px 80px}

.lesson-meta-row{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;
}
.lesson-num-badge{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;
  background:var(--holo);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  font-weight:500;text-transform:uppercase;
}
.lesson-mode-chip{
  font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:1.6px;
  text-transform:uppercase;font-weight:500;
  padding:5px 11px;border-radius:50px;
  border:1px solid;
}
.lesson-mode-chip.has-video{
  color:var(--mint);border-color:rgba(142,255,213,0.35);
  background:rgba(142,255,213,0.06);
}
.lesson-mode-chip.quick-day{
  color:var(--pink-2);border-color:rgba(255,138,209,0.35);
  background:rgba(255,138,209,0.06);
}
.lesson-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.lesson-title{
  font-family:'Poppins',sans-serif;font-weight:900;
  font-size:clamp(26px,3.2vw,38px);line-height:1.12;
  color:var(--ink);letter-spacing:-0.4px;
}
.lesson-emoji{font-size:0.85em;margin-right:4px;display:inline-block;filter:drop-shadow(0 2px 10px rgba(178,107,255,0.4))}
.accent-gradient{
  background:var(--holo);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  font-style:italic;font-weight:900;
}
.lesson-top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:6px}
.lesson-done-top{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;font-weight:500;
  padding:9px 16px;border-radius:50px;border:none;cursor:pointer;transition:all .2s;
}
.lesson-done-top.pending{background:rgba(255,255,255,0.04);color:var(--ink-soft);border:1px solid var(--border)}
.lesson-done-top.pending:hover{background:rgba(255,255,255,0.08);border-color:var(--border-strong)}
.lesson-done-top.complete{background:var(--holo);color:#fff;box-shadow:0 4px 16px rgba(178,107,255,0.4)}

/* ======== Tabs ======== */
.tabs{
  display:flex;gap:6px;padding:4px;
  background:rgba(13,9,34,0.5);
  border:1px solid var(--border);
  border-radius:14px;margin-bottom:32px;
  backdrop-filter:blur(10px);
  overflow-x:auto;
}
.tab{
  display:flex;align-items:center;gap:6px;
  padding:10px 18px;border:none;background:transparent;
  color:var(--ink-faint);cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;
  border-radius:10px;transition:all .2s;
  letter-spacing:0.2px;white-space:nowrap;
}
.tab:hover{color:var(--ink-soft);background:rgba(255,255,255,0.03)}
.tab.active{
  background:var(--holo);color:#fff;
  box-shadow:0 3px 14px rgba(178,107,255,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
}
.tab-icon{font-size:13px}
.tab-label{font-size:13px}

/* ======== Tab content ======== */
.tab-content{animation:tab-fade .35s ease}
@keyframes tab-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pane{display:flex;flex-direction:column;gap:16px}

/* ======== Overview: description + hero callout ======== */
.lesson-desc{
  font-size:16px;line-height:1.85;color:var(--ink-soft);
  padding:20px 22px;
  background:rgba(255,255,255,0.035);
  border-left:3px solid var(--purple);
  border-radius:0 14px 14px 0;
}

.hero-callout{
  position:relative;padding:32px 28px;margin:10px 0;
  background:var(--cream);
  color:var(--ink-dark);
  border-radius:20px;
  box-shadow:0 12px 48px rgba(178,107,255,0.25), 0 0 0 1px rgba(255,255,255,0.4) inset;
  overflow:hidden;
}
.hero-callout::before{
  content:'';position:absolute;top:-50%;right:-30%;
  width:70%;height:200%;
  background:radial-gradient(ellipse,rgba(255,107,193,0.15),transparent 70%);
  pointer-events:none;
}
.hero-mark{
  position:absolute;top:8px;left:18px;
  font-family:'Fraunces',serif;font-size:80px;line-height:1;
  color:var(--purple);opacity:0.22;font-weight:900;pointer-events:none;
}
.hero-text{
  position:relative;z-index:1;
  font-family:'Fraunces',serif;font-style:italic;font-weight:600;
  font-size:clamp(18px,2.2vw,24px);line-height:1.45;
  color:#332756;
}


/* ======== Launch Link (quiz CTA, sits under the tab row) ======== */
.launch-link{
  display:flex;align-items:center;gap:14px;
  margin:14px 0 2px;padding:16px 20px;
  border-radius:16px;text-decoration:none;
  background:linear-gradient(135deg, rgba(255,107,193,0.12), rgba(107,213,255,0.10));
  border:1px solid rgba(255,138,209,0.4);
  box-shadow:0 8px 28px rgba(178,107,255,0.18);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.launch-link:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 38px rgba(178,107,255,0.3);
  border-color:rgba(255,138,209,0.7);
}
.ll-emoji{font-size:24px;flex-shrink:0;line-height:1}
.ll-text{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.ll-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;
  color:var(--ink);letter-spacing:-0.2px;line-height:1.3;
}
.ll-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.ll-arrow{font-size:18px;color:var(--pink);flex-shrink:0;transition:transform .25s}
.launch-link:hover .ll-arrow{transform:translateX(4px)}
@media(max-width:640px){
  .launch-link{padding:14px 16px;gap:11px}
  .ll-title{font-size:14px}
  .ll-sub{font-size:12px}
}

/* ======== Tier Comparison ======== */
.tier-wrap{margin-top:28px}
.tier-intro{text-align:center;margin-bottom:20px}
.tier-intro-badge{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;
  color:var(--cyan);text-transform:uppercase;font-weight:500;margin-bottom:8px;
}
.tier-intro-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;color:var(--ink);margin-bottom:6px;
}
.tier-intro-sub{font-size:13px;color:var(--ink-faint)}
.tier-link{color:var(--cyan);font-weight:600}

.tier-cards{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  margin-top:8px;
}
.tier-card{
  border-radius:18px;padding:22px 20px;
  position:relative;overflow:hidden;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  display:flex;flex-direction:column;
}
.tier-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(178,107,255,0.3)}

.tier-light{
  background:var(--cream);
  color:var(--ink-dark);
  box-shadow:0 8px 32px rgba(178,107,255,0.15), 0 0 0 1px rgba(255,255,255,0.4) inset;
}
.tier-light .tier-name{color:var(--ink-dark)}
.tier-light .tier-tagline{color:#6b5d8a}
.tier-light .tier-desc{color:#4d4268}
.tier-light .tier-item-text{color:#332756}
.tier-light .tier-cta{color:var(--purple);border-top:1px dashed rgba(178,107,255,0.3)}
.tier-light .tier-divider{background:rgba(178,107,255,0.2)}

.tier-dark{
  background:linear-gradient(145deg, #1c1340 0%, #13092a 100%);
  border:1px solid var(--border-strong);
  color:var(--ink);
}
.tier-dark .tier-cta{color:var(--purple-2);border-top:1px dashed rgba(178,107,255,0.3)}
.tier-dark .tier-divider{background:rgba(178,107,255,0.25)}

.tier-holo{
  background:
    linear-gradient(145deg, rgba(255,107,193,0.15), rgba(107,213,255,0.1)),
    linear-gradient(145deg, #2a1a4d 0%, #1a0f36 100%);
  border:1px solid rgba(255,138,209,0.4);
  color:var(--ink);
  box-shadow:0 0 40px rgba(255,138,209,0.15);
  position:relative;
}
.tier-holo::before{
  content:'';position:absolute;inset:0;border-radius:18px;padding:1px;
  background:var(--holo);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;opacity:0.6;
}
.tier-holo .tier-name{background:var(--holo);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tier-holo .tier-cta{color:var(--mint);border-top:1px dashed rgba(142,255,213,0.4)}
.tier-holo .tier-divider{background:rgba(142,255,213,0.25)}

.tier-name{
  font-family:'Poppins',sans-serif;font-weight:900;font-size:22px;
  letter-spacing:-0.3px;margin-bottom:4px;
}
.tier-tagline{
  font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  font-size:13px;color:var(--ink-soft);margin-bottom:10px;line-height:1.3;
}
.tier-desc{font-size:12.5px;color:var(--ink-faint);line-height:1.5;margin-bottom:14px}
.tier-divider{height:1px;margin-bottom:14px;background:rgba(178,107,255,0.25)}
.tier-items{display:flex;flex-direction:column;gap:9px;flex:1;margin-bottom:14px}
.tier-item{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.4}
.tier-item-icon{flex-shrink:0;font-size:14px;margin-top:1px}
.tier-item-text{color:var(--ink-soft);flex:1}

.tier-cta{
  padding-top:12px;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:500;
}

/* Clickable tier link */
a.tier-link{
  color:var(--cyan);font-weight:600;text-decoration:none;

.vip-ready-badge{

}
.vip-ready-footer{

}
.vip-ready-dot{color:var(--pink);margin-right:6px;font-weight:700}
a.vip-ready-link{
  color:var(--mint);font-weight:700;text-decoration:none;

}
a.vip-ready-link:hover{color:var(--cyan);border-bottom-color:var(--cyan)}

/* ======== Philosophy Triad (Day 1) ======== */
.triad-wrap{margin-top:24px;position:relative}
.triad-intro{text-align:center;margin-bottom:22px}
.triad-badge{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;
  color:var(--cyan);text-transform:uppercase;font-weight:500;
}
.triad-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  position:relative;z-index:1;
}
.triad-card{
  position:relative;
  padding:28px 20px 24px;border-radius:20px;
  background:linear-gradient(160deg,var(--cream) 0%,var(--cream-2) 100%);
  color:var(--ink-dark);text-align:center;
  box-shadow:0 8px 28px rgba(178,107,255,0.18), 0 0 0 1px rgba(255,255,255,0.4) inset;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}
.triad-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--holo);opacity:0.85;
}
.triad-card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 14px 38px rgba(178,107,255,0.28)}
.triad-emoji{
  font-size:36px;line-height:1;margin-bottom:10px;
  filter:drop-shadow(0 4px 12px rgba(178,107,255,0.3));
  animation:triad-float 4s ease-in-out infinite;
}
.triad-card:nth-child(2) .triad-emoji{animation-delay:.8s}
.triad-card:nth-child(3) .triad-emoji{animation-delay:1.6s}
@keyframes triad-float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.triad-label{
  font-family:'Poppins',sans-serif;font-weight:900;font-size:18px;
  color:var(--ink-dark);letter-spacing:-0.2px;margin-bottom:4px;
}
.triad-sub{font-size:12.5px;color:#5d5280;line-height:1.45;font-weight:500}
.triad-ring{display:none}

/* ======== Chart Focus (Day 5) ======== */
.cf-wrap{margin-top:18px;position:relative}
.cf-intro{text-align:center;margin-bottom:20px}
.cf-badge{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;
  color:var(--cyan);text-transform:uppercase;font-weight:500;margin-bottom:6px;
}
.cf-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;color:var(--ink);
  letter-spacing:-0.2px;
}
.cf-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;
}
.cf-focus-card{
  position:relative;
  padding:24px 18px 22px;border-radius:18px;
  background:linear-gradient(145deg,#1c1340 0%,#13092a 100%);
  border:1px solid rgba(178,107,255,0.35);
  text-align:center;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}
.cf-focus-card::before{
  content:'';position:absolute;inset:0;border-radius:18px;padding:1px;
  background:var(--holo);opacity:0.5;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}
.cf-focus-card::after{
  content:'';position:absolute;top:-40px;left:50%;transform:translateX(-50%);
  width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,107,193,0.22),transparent 70%);
  pointer-events:none;
}
.cf-focus-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(178,107,255,0.3)}
.cf-focus-num{
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;
  color:var(--pink-2);margin-bottom:6px;font-weight:500;
  position:relative;z-index:1;
}
.cf-focus-label{
  font-family:'Poppins',sans-serif;font-weight:900;font-size:22px;
  background:var(--holo);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-0.3px;margin-bottom:4px;
  position:relative;z-index:1;
}
.cf-focus-desc{
  font-size:12.5px;color:var(--ink-soft);line-height:1.45;
  position:relative;z-index:1;
}
.cf-skip-row{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:14px 18px;border-radius:14px;
  background:rgba(255,255,255,0.03);
  border:1px dashed rgba(178,107,255,0.25);
}
.cf-skip-label{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;
  color:var(--ink-faint);text-transform:uppercase;font-weight:500;
  margin-right:4px;
}
.cf-skip-chip{
  padding:4px 11px;border-radius:50px;
  background:rgba(255,255,255,0.04);
  font-size:11.5px;color:var(--ink-faint);font-weight:600;
  letter-spacing:0.2px;
  text-decoration:line-through;
  text-decoration-color:rgba(255,107,193,0.5);
  text-decoration-thickness:1.5px;
}

/* ======== Invite Walkthrough (Day 7) ======== */
.iw-wrap{
  padding:26px 22px;border-radius:22px;
  background:linear-gradient(160deg, rgba(142,255,213,0.08), rgba(178,107,255,0.08));
  border:1px solid rgba(142,255,213,0.25);
  position:relative;overflow:hidden;
}
.iw-wrap::before{
  content:'';position:absolute;top:-80px;right:-40px;
  width:220px;height:220px;
  background:radial-gradient(circle,rgba(142,255,213,0.15),transparent 70%);
  pointer-events:none;
}
.iw-intro{text-align:center;margin-bottom:22px;position:relative;z-index:1}
.iw-badge{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;
  color:var(--mint);text-transform:uppercase;font-weight:500;margin-bottom:6px;
}
.iw-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;
  color:var(--ink);letter-spacing:-0.3px;
}
.iw-steps{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.iw-step{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;
  padding:20px 22px;border-radius:16px;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--border);
}
.iw-step-left{display:flex;flex-direction:column;gap:6px}
.iw-step-num{
  font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;
  color:var(--mint);font-weight:500;
}
.iw-step-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:17px;
  color:var(--ink);letter-spacing:-0.2px;line-height:1.25;
}
.iw-step-desc{font-size:13.5px;line-height:1.65;color:var(--ink-soft)}
.iw-step-visual{display:flex;align-items:center;justify-content:center;min-height:180px}

/* ---- Mock Skool sidebar (Step 1) ---- */
.mock-sidebar{
  width:100%;max-width:260px;
  background:#fff;border-radius:14px;padding:12px;
  box-shadow:0 8px 28px rgba(0,0,0,0.25);
  font-family:'Nunito',sans-serif;
  color:#1a1530;
}
.mock-sb-banner{
  height:70px;border-radius:10px;margin-bottom:10px;
  background:linear-gradient(135deg,#b69cd8 0%,#7d5ca8 50%,#5a3f88 100%);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.mock-sb-banner::before{
  content:'';position:absolute;top:20%;right:10%;width:20px;height:20px;
  background:radial-gradient(circle,#fff,transparent 70%);opacity:0.6;
}
.mock-sb-banner-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:10px;
  color:#fff;text-align:center;line-height:1.2;
}
.mock-sb-url{font-size:10px;color:#888;margin-bottom:8px}
.mock-sb-desc{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.mock-sb-line{height:6px;background:#e8e3f0;border-radius:3px}
.mock-sb-stats{
  display:flex;justify-content:space-around;padding:8px 0;
  border-top:1px solid #eee;border-bottom:1px solid #eee;margin-bottom:8px;
}
.mock-sb-stat{text-align:center}
.mock-sb-stat-num{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:#1a1530;line-height:1}
.mock-sb-stat-lbl{font-size:8px;color:#888;margin-top:2px}
.mock-sb-avatars{display:flex;gap:-4px;margin-bottom:10px;justify-content:center}
.mock-sb-avatar{
  width:20px;height:20px;border-radius:50%;border:2px solid #fff;
  margin-left:-4px;
}
.mock-sb-avatar:first-child{margin-left:0}
.mock-sb-btn-wrap{position:relative}
.mock-sb-btn{
  padding:10px 14px;border:2px solid #e8a84d;border-radius:8px;
  text-align:center;font-family:'Nunito',sans-serif;font-weight:700;
  font-size:11px;color:#8a7355;letter-spacing:0.5px;
  animation:iw-pulse 2s ease-in-out infinite;
}
@keyframes iw-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(232,168,77,0.4)}
  50%{box-shadow:0 0 0 8px rgba(232,168,77,0)}
}
.mock-sb-arrow{
  position:absolute;top:50%;right:-90px;transform:translateY(-50%);
  font-family:'Fraunces',serif;font-style:italic;font-size:12px;
  color:var(--mint);white-space:nowrap;font-weight:600;
}

/* ---- Mock popup (Step 2) ---- */
.mock-popup{
  width:100%;max-width:300px;
  background:#fff;border-radius:14px;padding:20px 18px;
  box-shadow:0 12px 40px rgba(0,0,0,0.35);
  font-family:'Nunito',sans-serif;color:#1a1530;
}
.mock-pop-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:14px;
  color:#1a1530;margin-bottom:10px;
}
.mock-pop-body{
  font-size:11px;line-height:1.5;color:#444;margin-bottom:14px;
}
.mock-pop-pct{color:#22a566;font-weight:700}
.mock-pop-link-row{
  display:flex;gap:0;border:1px solid #e8e3f0;border-radius:6px;
  overflow:hidden;position:relative;align-items:stretch;
}
.mock-pop-link{
  flex:1;padding:8px 10px;font-size:9.5px;color:#5e8fd4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:'DM Mono',monospace;
  display:flex;align-items:center;
}
.mock-pop-copy{
  padding:8px 14px;background:#f4d98a;color:#8a7355;
  font-weight:700;font-size:10px;letter-spacing:0.5px;
  display:flex;align-items:center;justify-content:center;
  animation:iw-pulse-gold 2s ease-in-out infinite;
}
@keyframes iw-pulse-gold{
  0%,100%{background:#f4d98a}
  50%{background:#ffd560}
}
.mock-pop-arrow{
  position:absolute;top:50%;right:-90px;transform:translateY(-50%);
  font-family:'Fraunces',serif;font-style:italic;font-size:12px;
  color:var(--mint);white-space:nowrap;font-weight:600;
}

/* ---- Mock "saved" confirmation (Step 3) ---- */
.mock-saved{
  display:flex;gap:14px;align-items:flex-start;
  width:100%;max-width:300px;
  padding:18px 20px;border-radius:14px;
  background:linear-gradient(135deg, rgba(142,255,213,0.2), rgba(142,255,213,0.08));
  border:1px solid rgba(142,255,213,0.4);
}
.mock-saved-check{
  width:32px;height:32px;border-radius:50%;
  background:var(--mint);color:#0a1024;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;flex-shrink:0;
  box-shadow:0 0 20px rgba(142,255,213,0.5);
}
.mock-saved-text{flex:1}
.mock-saved-title{
  font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;
  color:var(--mint);margin-bottom:3px;
}
.mock-saved-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.5}

.iw-outro{
  margin-top:16px;padding:14px 18px;border-radius:12px;
  background:rgba(142,255,213,0.08);
  border:1px dashed rgba(142,255,213,0.35);
  font-size:13px;line-height:1.6;color:var(--ink-soft);
  position:relative;z-index:1;
}
.iw-outro-dot{color:var(--mint);margin-right:6px;font-weight:700}

/* ======== Accordion ======== */
.concept-wrap{width:100%}
.accordion{
  border-radius:14px;overflow:hidden;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  transition:all .25s;
}
.accordion:hover{background:rgba(255,255,255,0.06);border-color:var(--border-strong)}
.accordion.open{
  background:rgba(255,255,255,0.07);
  border-color:rgba(178,107,255,0.45);
  box-shadow:0 8px 24px rgba(178,107,255,0.12);
}
.accordion-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:16px 20px;
  background:transparent;border:none;cursor:pointer;
  color:var(--ink);text-align:left;
  font-family:'Nunito',sans-serif;
}
.accordion-left{display:flex;align-items:center;gap:12px;flex:1}
.accordion-icon{font-size:18px;flex-shrink:0}
.accordion-headline{
  font-family:'Poppins',sans-serif;font-weight:700;font-size:15.5px;
  line-height:1.35;color:var(--ink);letter-spacing:-0.1px;
}
.accordion-chev{
  font-family:'DM Mono',monospace;font-size:22px;line-height:1;
  color:var(--purple-2);font-weight:400;
  transition:transform .25s;width:24px;text-align:center;
}
.accordion.open .accordion-chev{color:var(--pink)}
.accordion-panel{
  overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);
}
.accordion-body{
  padding:0 20px 18px;
  font-size:14.5px;line-height:1.75;color:var(--ink-soft);
  font-family:'Nunito',sans-serif;
}

/* ======== Pull Quote ======== */
.pullquote{
  position:relative;padding:28px 32px 28px 70px;
  background:linear-gradient(135deg, #0d0922, #1c1340, #0d0922);
  border-radius:18px;
  border:1px solid var(--border-strong);
  overflow:hidden;margin:4px 0;
}
.pullquote::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:140px;height:140px;
  background:radial-gradient(circle, rgba(255,107,193,0.2) 0%, transparent 70%);
  pointer-events:none;
}
.pullquote-mark{
  position:absolute;top:10px;left:18px;
  font-family:'Fraunces',serif;font-size:72px;line-height:1;
  color:var(--pink);opacity:0.5;font-weight:900;pointer-events:none;
}
.pullquote-text{
  position:relative;z-index:1;
  font-family:'Fraunces',serif;font-style:italic;font-weight:600;
  font-size:clamp(16px,2vw,20px);line-height:1.5;
  color:var(--ink);
}

/* ======== Callout ======== */
.callout{border-radius:16px;padding:22px 24px;margin:4px 0;position:relative;overflow:hidden}
.callout-white{
  background:var(--cream-2);color:var(--ink-dark);
  box-shadow:0 8px 28px rgba(178,107,255,0.15), 0 0 0 1px rgba(255,255,255,0.5) inset;
}
.callout-white .callout-headline{color:var(--ink-dark);font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;margin-bottom:8px;letter-spacing:-0.1px}
.callout-white .callout-body{color:#4d4268;font-size:14px;line-height:1.7}
.callout-white::before{
  content:'';position:absolute;top:0;left:0;width:4px;height:100%;
  background:var(--holo);
}
.callout-gradient{
  background:linear-gradient(135deg, rgba(255,107,193,0.18), rgba(178,107,255,0.18));
  border:1px solid var(--border-strong);
  color:var(--ink);
}
.callout-gradient .callout-headline{color:var(--ink);font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;margin-bottom:8px;letter-spacing:-0.1px}
.callout-gradient .callout-body{color:var(--ink-soft);font-size:14px;line-height:1.7}
.callout-gradient::before{
  content:'✦';position:absolute;top:14px;right:16px;
  color:var(--pink);opacity:0.5;font-size:16px;
}

/* ======== Path Picker ======== */
.pathpicker{
  padding:28px;border-radius:22px;
  background:linear-gradient(145deg, rgba(255,107,193,0.08), rgba(107,213,255,0.06));
  border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.pathpicker::before{
  content:'';position:absolute;top:-60px;left:-30px;
  width:180px;height:180px;
  background:radial-gradient(circle,rgba(178,107,255,0.15),transparent 70%);
  pointer-events:none;
}
.pp-question{text-align:center;margin-bottom:22px;position:relative;z-index:1}
.pp-q-badge{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;
  color:var(--cyan);text-transform:uppercase;font-weight:500;margin-bottom:6px;
}
.pp-q-text{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;
  color:var(--ink);letter-spacing:-0.3px;
}
.pp-options{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.pp-option{
  width:100%;padding:18px 22px;
  background:var(--cream-2);color:var(--ink-dark);
  border:2px solid transparent;border-radius:14px;
  cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  font-family:'Nunito',sans-serif;font-weight:700;font-size:15px;text-align:left;
  box-shadow:0 4px 16px rgba(178,107,255,0.12);
}
.pp-option:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(178,107,255,0.2)}
.pp-option.picked{
  background:var(--holo);color:#fff;border-color:#fff;
  box-shadow:0 8px 28px rgba(255,107,193,0.4);
}
.pp-option.dim{opacity:0.45;transform:scale(0.98)}
.pp-option-arrow{
  font-family:'DM Mono',monospace;font-size:18px;
  color:var(--purple);transition:transform .2s;
}
.pp-option.picked .pp-option-arrow{color:#fff;transform:translateX(4px)}

.pp-result{
  margin-top:20px;padding:22px 24px;
  background:linear-gradient(145deg, #1c1340 0%, #13092a 100%);
  border:1px solid var(--border-strong);
  border-radius:16px;
  animation:fadeup .45s cubic-bezier(.25,.9,.3,1);
  position:relative;z-index:1;
}
.pp-result-eyebrow{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;
  color:var(--mint);text-transform:uppercase;font-weight:500;margin-bottom:6px;
}
.pp-result-name{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;
  background:var(--holo);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:6px;letter-spacing:-0.2px;
}
.pp-result-tier{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px}
.pp-result-tier strong{color:var(--pink-2)}
.pp-result-points{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.pp-result-point{display:flex;gap:10px;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.pp-point-dot{color:var(--pink);flex-shrink:0;margin-top:1px;font-size:11px}
.pp-result-cta{
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1.5px;
  color:var(--mint);text-transform:uppercase;font-weight:500;
  padding-top:12px;border-top:1px dashed rgba(142,255,213,0.3);
}

/* ======== Philosophy Triad (Day 1) ======== */
.triad-wrap{margin-top:22px}
.triad-intro{text-align:center;margin-bottom:16px}
.triad-badge{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;
  color:var(--mint);text-transform:uppercase;font-weight:500;
}
.triad-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  position:relative;padding:8px 0;
}
.triad-ring{
  position:absolute;inset:10% 12%;
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,138,209,0.15), transparent 60%);
  pointer-events:none;z-index:0;
  animation:triad-pulse 4s ease-in-out infinite alternate;
}
@keyframes triad-pulse{
  0%{opacity:0.4;transform:scale(0.95)}
  100%{opacity:0.8;transform:scale(1.05)}
}
.triad-card{
  position:relative;z-index:1;
  background:var(--cream-2);color:var(--ink-dark);
  border-radius:18px;padding:22px 18px;text-align:center;
  box-shadow:0 8px 24px rgba(178,107,255,0.15), 0 0 0 1px rgba(255,255,255,0.5) inset;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
}
.triad-card:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 14px 32px rgba(178,107,255,0.25)}
.triad-card:nth-child(2):hover{transform:translateY(-4px) rotate(0deg)}
.triad-card:nth-child(3):hover{transform:translateY(-4px) rotate(1deg)}
.triad-emoji{font-size:34px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 2px 10px rgba(178,107,255,0.3))}
.triad-label{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;
  color:var(--ink-dark);letter-spacing:-0.2px;margin-bottom:4px;
}
.triad-sub{
  font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  font-size:12.5px;color:#6b5d8a;line-height:1.35;
}

/* ======== Chart Focus (Day 5) ======== */
.cf-wrap{margin-top:22px;padding:26px;border-radius:22px;
  background:linear-gradient(145deg, rgba(107,213,255,0.08), rgba(178,107,255,0.08));
  border:1px solid var(--border);position:relative;overflow:hidden;
}
.cf-wrap::before{
  content:'';position:absolute;top:-50px;right:-50px;
  width:160px;height:160px;
  background:radial-gradient(circle,rgba(142,255,213,0.12),transparent 70%);
  pointer-events:none;
}
.cf-intro{text-align:center;margin-bottom:16px;position:relative;z-index:1}
.cf-badge{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;
  color:var(--cyan);text-transform:uppercase;font-weight:500;margin-bottom:6px;
}
.cf-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:19px;
  color:var(--ink);letter-spacing:-0.3px;
}
.cf-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  position:relative;z-index:1;margin-bottom:18px;
}
.cf-focus-card{
  background:var(--cream-2);color:var(--ink-dark);
  border-radius:14px;padding:18px 14px;text-align:center;
  box-shadow:0 6px 18px rgba(178,107,255,0.15), 0 0 0 1px rgba(255,255,255,0.4) inset;
  transition:all .25s;position:relative;
}
.cf-focus-card::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:30%;height:3px;
  background:var(--holo);border-radius:0 0 6px 6px;
}
.cf-focus-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(178,107,255,0.22)}
.cf-focus-num{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;
  color:var(--purple);margin-bottom:6px;font-weight:500;
}
.cf-focus-label{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:17px;
  color:var(--ink-dark);letter-spacing:-0.2px;margin-bottom:4px;
}
.cf-focus-desc{
  font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  font-size:12px;color:#6b5d8a;line-height:1.35;
}
.cf-skip-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:14px 16px;border-radius:12px;
  background:rgba(0,0,0,0.2);border:1px dashed rgba(178,107,255,0.25);
  position:relative;z-index:1;
}
.cf-skip-label{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;
  color:var(--ink-faint);text-transform:uppercase;font-weight:500;margin-right:4px;
}
.cf-skip-chip{
  font-size:11.5px;color:var(--ink-faint);
  padding:4px 10px;border-radius:50px;
  background:rgba(255,255,255,0.04);
  text-decoration:line-through;text-decoration-color:rgba(255,107,193,0.5);
  text-decoration-thickness:1.5px;
}

/* ======== Actions pane ======== */
.actions-pane{gap:12px}
.actions-lead{
  padding:18px 20px;border-radius:14px;
  background:linear-gradient(135deg, rgba(255,138,209,0.1), rgba(178,107,255,0.1));
  border:1px solid var(--border);
  margin-bottom:8px;
}
.actions-lead-badge{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;
  color:var(--pink-2);text-transform:uppercase;font-weight:500;margin-bottom:4px;
}
.actions-lead-text{font-size:13.5px;line-height:1.6;color:var(--ink-soft)}

.action-card{
  display:flex;gap:16px;padding:18px 22px;
  background:var(--cream-2);
  border-radius:14px;
  box-shadow:0 4px 18px rgba(178,107,255,0.1), 0 0 0 1px rgba(255,255,255,0.4) inset;
  transition:all .25s;
}
.action-card:hover{transform:translateX(4px);box-shadow:0 6px 24px rgba(178,107,255,0.18)}
.action-num{
  font-family:'DM Mono',monospace;font-size:14px;font-weight:500;
  color:var(--purple);
  min-width:32px;padding-top:2px;
  letter-spacing:1px;
}
.action-text{
  font-size:14.5px;line-height:1.65;color:var(--ink-dark);
  flex:1;font-family:'Nunito',sans-serif;font-weight:500;
}

/* ======== Prompt pane ======== */
.prompt-intro{font-size:14px;line-height:1.65;color:var(--ink-soft);padding:0 4px}
.prompt-box{
  background:linear-gradient(135deg, #0d0922, #1c1340, #0d0922);
  border-radius:18px;padding:26px;position:relative;
  border:1px solid var(--border-strong);overflow:hidden;
}
.prompt-box::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:180px;height:180px;
  background:radial-gradient(circle, rgba(255,107,193,0.18) 0%, transparent 70%);
  pointer-events:none;
}
.prompt-box::after{
  content:'';position:absolute;bottom:-40px;left:-40px;
  width:140px;height:140px;
  background:radial-gradient(circle, rgba(107,213,255,0.12) 0%, transparent 70%);
  pointer-events:none;
}
.prompt-hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;position:relative;z-index:1;
}
.prompt-badge{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--cyan);font-weight:500;
}
.prompt-copy-btn{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.5px;
  font-weight:600;color:#fff;background:var(--holo);
  padding:8px 16px;border-radius:8px;border:none;cursor:pointer;transition:all .15s;
  box-shadow:0 2px 12px rgba(178,107,255,0.4);
}
.prompt-copy-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(178,107,255,0.55)}
.prompt-text{
  font-family:'DM Mono',monospace;font-size:12px;line-height:1.9;
  color:rgba(245,240,255,0.78);white-space:pre-wrap;
  position:relative;z-index:1;
}

/* ======== Bottom + footer ======== */
.lesson-bottom{
  margin-top:40px;padding-top:28px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.bottom-done-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;
  padding:14px 30px;border-radius:50px;border:none;cursor:pointer;transition:all .2s;
  letter-spacing:0.3px;
}
.bottom-done-btn.pending{
  background:var(--holo);color:#fff;
  box-shadow:0 6px 24px rgba(178,107,255,0.4),inset 0 1px 0 rgba(255,255,255,0.25);
}
.bottom-done-btn.pending:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(178,107,255,0.55)}
.bottom-done-btn.complete{background:rgba(255,107,193,0.15);color:var(--pink);border:1px solid var(--border-strong)}
.bottom-next{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;color:var(--ink-soft);cursor:pointer;transition:color .15s;
  background:none;border:none;font-family:'Nunito',sans-serif;font-weight:600;
}
.bottom-next:hover{color:var(--cyan)}

.lesson-footer{margin-top:52px;padding-top:28px;border-top:1px solid var(--border);text-align:center}
.lf-brand{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin-bottom:6px}
.lf-brand em{font-style:italic;background:var(--holo);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lf-details{font-size:11px;color:var(--ink-faint);margin-bottom:4px}
.lf-links{font-size:11px;color:var(--ink-faint)}
.lf-links a{color:var(--purple-2);text-decoration:none}
.lf-links a:hover{color:var(--pink)}
.lf-credit{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint);margin-top:10px;opacity:0.7}

/* ======== Scrollbars ======== */
.side-list::-webkit-scrollbar,.main::-webkit-scrollbar{width:4px}
.side-list::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:rgba(178,107,255,0.3);border-radius:2px}
.side-list::-webkit-scrollbar-track,.main::-webkit-scrollbar-track{background:transparent}

/* ======== Mobile ======== */
@media(max-width:900px){
  .tier-cards{grid-template-columns:1fr;gap:14px}
  .triad-grid{grid-template-columns:1fr;gap:12px}
  .cf-grid{grid-template-columns:1fr;gap:10px}
  .vip-ready-grid{grid-template-columns:1fr;gap:10px}
  .iw-step{grid-template-columns:1fr;gap:18px}
  .mock-sb-arrow,.mock-pop-arrow{position:static;transform:none;margin-top:8px;text-align:center;display:block}
}
@media(max-width:768px){
  .topbar-nav{display:none}
  .mobile-toggle{display:block}
  .layout{position:relative}
  .sidebar{position:absolute;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .25s ease;box-shadow:4px 0 24px rgba(0,0,0,0.5)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.6);z-index:99}
  .sidebar-overlay.show{display:block}
  .main-inner{padding:28px 22px 80px}
  .lesson-top{flex-direction:column;gap:10px}
  .lesson-bottom{flex-direction:column;gap:12px;align-items:stretch}
  .bottom-done-btn{justify-content:center}
  .bottom-next{justify-content:center}
  .tabs{margin-left:-6px;margin-right:-6px;padding-left:4px;padding-right:4px}
  .tab{padding:9px 14px;font-size:12px}
  .accordion-headline{font-size:14.5px}
  .hero-text{font-size:17px}
  .pullquote{padding:24px 22px 24px 60px}
}

   NEW COMPONENTS FOR V9

}

}

/* ===== OLD BARGAIN CARD (Day 1) ===== */
.bargain-wrap{margin-top:30px}
.bargain-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
  color:var(--cyan);margin-bottom:12px;
}
.bargain-card{
  position:relative;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%),

  border-radius:20px;
  padding:36px 40px;

}
.bargain-card::before{

.bargain-header{position:relative;z-index:1;display:flex;align-items:center;gap:16px;margin-bottom:16px}
.bargain-stamp{

.bargain-title{

.bargain-body{

.bargain-form-label{

}
.bargain-form-tags{display:flex;flex-wrap:wrap;gap:7px}
.b-tag{
  font-size:12px;font-weight:600;
  padding:6px 12px;border-radius:100px;

}
.bargain-break{

.bargain-break-line{
  font-family:'Poppins',sans-serif;font-weight:800;font-style:italic;

  background:var(--holo);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;

}

/* ===== VALUES TRIAD (Day 1) ===== */
.values-wrap{margin-top:32px}
.values-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
  color:var(--mint);margin-bottom:8px;
}
.values-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;
  color:var(--ink);margin-bottom:18px;letter-spacing:-0.3px;
}
.values-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.value-card{
  position:relative;
  background:var(--card-2);
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px 22px;

  transition:all .2s;
}
.value-card::before{

.value-icon{font-size:28px;margin-bottom:14px}
.value-headline{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.value-over{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;
  color:var(--ink);letter-spacing:-0.3px;line-height:1.1;
}
.value-over-sep{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--ink-faint);font-weight:500;
  margin:2px 0;
}
.value-under{

  text-decoration-color:rgba(245,240,255,0.35);
}
.value-body{
  font-size:13px;line-height:1.7;color:var(--ink-soft);
}

/* ===== CATEGORY MAP (Day 1) ===== */
.catmap-wrap{margin-top:30px}
.catmap-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
  color:var(--purple-2);margin-bottom:8px;
}
.catmap-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;
  color:var(--ink);margin-bottom:16px;letter-spacing:-0.3px;
}
.catmap-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.catmap-card{
  background:var(--card-2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 14px;
  text-align:center;
  transition:all .2s;
  position:relative;
  overflow:hidden;
}
.catmap-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
}
.catmap-purple::before{background:linear-gradient(90deg,#b26bff,#c78fff)}
.catmap-pink::before{background:linear-gradient(90deg,#ff6bc1,#ff8ad1)}
.catmap-lime::before{background:linear-gradient(90deg,#d4ff00,#8effd5)}
.catmap-cyan::before{background:linear-gradient(90deg,#6bd5ff,#b26bff)}

.catmap-emoji{font-size:26px;margin-bottom:8px}
.catmap-name{

  font-size:11.5px;line-height:1.5;color:var(--ink-soft);
}

/* ===== CLASSROOM LINEUP (Day 1) ===== */
.clr-wrap{margin-top:30px}
.clr-badge{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;font-weight:500;color:var(--cyan);margin-bottom:8px}
.clr-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;color:var(--ink);margin-bottom:16px;letter-spacing:-0.3px}
.clr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.clr-card{position:relative;background:var(--card-2);border:1px solid var(--border);border-radius:14px;padding:16px 14px;transition:all .2s;overflow:hidden}

.clr-card:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.clr-new{position:absolute;top:10px;right:10px;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1.5px;font-weight:500;color:#0a1024;background:var(--mint);padding:3px 8px;border-radius:50px;box-shadow:0 0 12px rgba(142,255,213,0.5)}
.clr-here{position:absolute;top:8px;right:10px;color:var(--pink);font-size:12px;opacity:0.8}
.clr-e{font-size:22px;margin-bottom:8px}
.clr-n{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:var(--ink);letter-spacing:-0.2px;line-height:1.25;margin-bottom:5px}
.clr-d{font-size:11.5px;line-height:1.5;color:var(--ink-soft)}
.clr-caption{margin-top:14px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);font-style:italic;text-align:center}

/* ===== FIRE STREAK CARD (Day 1) ===== */
.fire-wrap{margin-top:30px}
.fire-card{
  background:linear-gradient(135deg, rgba(255,107,193,0.08) 0%, rgba(178,107,255,0.08) 100%);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px 32px;
  display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;
  overflow:hidden;position:relative;
}
.fire-left{position:relative;z-index:1}
.fire-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
  color:var(--pink);margin-bottom:6px;
}
.fire-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:18px;
  color:var(--ink);margin-bottom:10px;letter-spacing:-0.3px;
}
.fire-body{
  font-size:13.5px;line-height:1.7;color:var(--ink-soft);
}
.fire-visual{
  position:relative;width:220px;min-width:220px;
  display:flex;flex-direction:column;align-items:center;
}
.fire-bars{
  display:flex;align-items:flex-end;gap:3px;
  width:220px;height:70px;padding:6px;
  background:rgba(0,0,0,0.15);border-radius:10px;
  border:1px solid var(--border);
}
.fire-bar{
  flex:1;background:linear-gradient(180deg, #ff6bc1, #b26bff);
  border-radius:2px;opacity:0;
  animation:fireBarUp .5s ease forwards;
  box-shadow:0 0 6px rgba(255,107,193,0.4);
}
@keyframes fireBarUp{
  from{opacity:0;transform:scaleY(0.3);transform-origin:bottom}
  to{opacity:1;transform:scaleY(1);transform-origin:bottom}
}
.fire-streak-label{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;
  text-transform:uppercase;color:var(--ink-faint);margin-top:6px;font-weight:500;
}
.fire-emoji-float{
  position:absolute;top:-4px;right:-6px;
  font-size:28px;
  animation:fireFloat 2.4s ease-in-out infinite;
  filter:drop-shadow(0 0 10px rgba(255,107,193,0.6));
}
@keyframes fireFloat{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-6px) rotate(3deg)}
}

/* ===== ABOUT PAGE RECORDING GUIDE (Day 1) ===== */
.recguide-wrap{margin-top:32px;border:1px dashed rgba(178,107,255,0.4);border-radius:16px;overflow:hidden}
.recguide-banner{

.recguide-icon{

}

}
.recguide-n{

}
.recguide-beat-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:5px}
.recguide-beat{

  color:var(--ink);letter-spacing:-0.2px;
}
.recguide-time{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;

}

  font-size:13px;line-height:1.65;color:var(--ink-soft);
}

  margin-top:18px;padding:14px 18px;

/* ===== PATH CONVERGENCE (Day 2) ===== */
.pc-wrap{margin-top:30px}
.pc-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;

}

}

  font-style:italic;text-align:center;padding:0 18px;
}

/* ===== PRIMARY + SUPPORTING (Day 2) ===== */
.ps-wrap{margin-top:30px}
.ps-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
  color:var(--cyan);margin-bottom:14px;
}
.ps-cards{
  display:grid;grid-template-columns:1fr 50px 1fr;gap:14px;align-items:stretch;
}
.ps-card{

  transition:all .2s;
}
.ps-card.ps-primary{border-color:rgba(255,107,193,0.4)}

.ps-card.ps-support::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6bd5ff,#8effd5)}
.ps-card-label{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;color:var(--ink-faint);font-weight:500;margin-bottom:8px;
}
.ps-card-title{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;
  color:var(--ink);margin-bottom:10px;letter-spacing:-0.3px;
}
.ps-card-body{
  font-size:13.5px;line-height:1.65;color:var(--ink-soft);
}
.ps-connector{display:flex;align-items:center;justify-content:center}
.ps-plus{
  font-family:'Poppins',sans-serif;font-weight:300;font-size:36px;
  color:var(--purple-2);opacity:0.7;
}
.ps-footer{
  margin-top:16px;text-align:center;
  font-family:'Fraunces',serif;font-style:italic;font-size:15px;

}

/* ===== INFINITE VS FINITE (Day 3) ===== */
.ivf-wrap{margin-top:30px}
.ivf-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;

}
.ivf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ivf-card{
  background:var(--card-2);

  border-radius:18px;
  padding:26px 26px 24px;

}
.ivf-card.ivf-infinite{border-top:3px solid #b26bff}

.ivf-svg{margin-bottom:14px}
.ivf-svg svg{width:120px;height:80px}
.ivf-label{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;color:var(--ink-faint);font-weight:500;margin-bottom:4px;
}
.ivf-offer{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:18px;
  color:var(--ink);margin-bottom:10px;letter-spacing:-0.3px;
}
.ivf-body{
  font-size:13px;line-height:1.7;color:var(--ink-soft);
}
.ivf-footer{
  margin-top:16px;text-align:center;
  font-family:'Fraunces',serif;font-style:italic;font-size:15px;
  color:var(--ink-soft);
}

/* ===== SAME TOOL TWO POSITIONS (Day 4) ===== */
.sttp-wrap{margin-top:30px}
.sttp-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
  color:var(--cyan);margin-bottom:14px;
}
.sttp-diagram{
  background:linear-gradient(135deg, #0e1428, #161e3a);
  border:1px solid var(--border);border-radius:18px;
  padding:28px 24px;
}
.sttp-diagram svg{width:100%;height:auto;max-height:180px;display:block}
.sttp-caption{
  margin-top:14px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);
  font-style:italic;text-align:center;padding:0 18px;
}

/* ===== TREASURE GRID (Day 4) ===== */
.tg-wrap{margin-top:30px}
.tg-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
  color:var(--purple-2);margin-bottom:14px;
}
.tg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tg-tile{
  aspect-ratio:1;
  background:var(--card-2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  text-align:center;
  transition:all .2s;
  opacity:0;
  animation:tgIn .4s ease forwards;
}
@keyframes tgIn{
  from{opacity:0;transform:scale(0.85)}
  to{opacity:1;transform:scale(1)}
}
.tg-tile:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.tg-tile.tg-more{
  background:linear-gradient(135deg, rgba(255,107,193,0.12), rgba(178,107,255,0.12));
  border-color:var(--border-strong);
}
.tg-e{font-size:20px}
.tg-n{
  font-family:'Nunito',sans-serif;font-weight:700;font-size:10.5px;
  color:var(--ink);line-height:1.2;letter-spacing:-0.1px;
}
.tg-caption{
  margin-top:14px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);
  font-style:italic;text-align:center;
}

/* ===== NODE ARROW (Day 5) ===== */
.na-wrap{margin-top:30px}
.na-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
  color:var(--mint);margin-bottom:14px;
}
.na-diagram{
  background:linear-gradient(135deg, #0e1428, #161e3a);
  border:1px solid var(--border);border-radius:18px;
  padding:24px 20px;
}
.na-diagram svg{width:100%;height:auto;max-height:150px;display:block}
.na-caption{
  margin-top:14px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);
  font-style:italic;text-align:center;padding:0 18px;
}

/* ===== HALF-STARTED VS SHIPPED (Day 6) ===== */
.hss-wrap{margin-top:30px}
.hss-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
  color:var(--pink);margin-bottom:14px;
}
.hss-grid{
  display:grid;grid-template-columns:1fr 60px 1fr;gap:14px;align-items:center;
  background:linear-gradient(135deg, #0e1428, #161e3a);
  border:1px solid var(--border);border-radius:18px;
  padding:28px 24px;
}
.hss-side{display:flex;flex-direction:column;gap:14px;align-items:center}
.hss-side-label{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;color:var(--ink-faint);font-weight:500;
}
.hss-tiles{
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;
}
.hss-tile-half{
  background:rgba(245,240,255,0.04);
  border:1px dashed rgba(245,240,255,0.15);
  border-radius:6px;
  height:38px;padding:6px;
  display:flex;align-items:center;
}
.hss-tile-bar{
  height:4px;background:rgba(245,240,255,0.25);border-radius:100px;
}
.hss-side-caption{
  font-size:12px;line-height:1.6;color:var(--ink-faint);
  text-align:center;font-style:italic;
}
.hss-arrow{display:flex;align-items:center;justify-content:center}
.hss-arrow svg{width:44px;height:44px;filter:drop-shadow(0 0 8px rgba(255,107,193,0.4))}
.hss-shipped{
  background:linear-gradient(135deg, rgba(255,107,193,0.12), rgba(142,255,213,0.08));
  border:1px solid var(--border-strong);
  border-radius:12px;
  padding:20px 18px;width:100%;
  display:flex;flex-direction:column;gap:7px;align-items:center;
  box-shadow:0 8px 24px rgba(178,107,255,0.15);
  position:relative;
}
.hss-shipped-check{
  position:absolute;top:-10px;right:-10px;
  width:28px;height:28px;border-radius:50%;
  background:var(--holo);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;
  box-shadow:0 4px 12px rgba(178,107,255,0.5);
}
.hss-shipped-bar{
  width:100%;height:6px;background:rgba(245,240,255,0.25);border-radius:100px;
}
.hss-shipped-bar.full{background:var(--holo);box-shadow:0 0 10px rgba(255,107,193,0.4)}
.hss-ship .hss-side-caption{color:var(--mint);font-style:normal;font-weight:600}

/* ===== REFERRAL MATH HERO (Day 7) ===== */
.rm-wrap{margin-top:30px}
.rm-badge{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
  color:var(--mint);margin-bottom:14px;
}
.rm-rows{display:flex;flex-direction:column;gap:10px}
.rm-row{
  display:grid;grid-template-columns:60px 1fr 30px 1.4fr;gap:14px;align-items:center;
  padding:18px 22px;
  background:var(--card-2);
  border:1px solid var(--border);
  border-radius:14px;
  position:relative;overflow:hidden;
}
.rm-row::before{content:'';position:absolute;top:0;bottom:0;left:0;width:4px}
.rm-mint::before{background:linear-gradient(180deg,#8effd5,#6bd5ff)}
.rm-pink::before{background:linear-gradient(180deg,#ff6bc1,#ff8ad1)}
.rm-purple::before{background:linear-gradient(180deg,#b26bff,#c78fff)}
.rm-num{
  font-family:'Poppins',sans-serif;font-weight:900;font-size:40px;
  background:var(--holo);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-align:center;line-height:1;
}
.rm-label{
  font-size:14px;color:var(--ink-soft);line-height:1.4;
}
.rm-label strong{color:var(--ink);font-weight:700}
.rm-equal{
  font-family:'DM Mono',monospace;font-size:22px;color:var(--ink-faint);text-align:center;
}
.rm-result{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;
  color:var(--ink);letter-spacing:-0.2px;line-height:1.3;
}
.rm-footer{
  margin-top:16px;text-align:center;
  font-family:'Fraunces',serif;font-style:italic;font-size:15px;
  color:var(--ink-soft);
}

/* ===== MOBILE RESPONSIVE FOR NEW COMPONENTS ===== */
@media(max-width:900px){
  .mission-card{grid-template-columns:1fr;gap:18px;padding:28px 24px;text-align:center}
  .mission-flame-bg{max-width:90px;margin:0 auto}
  .mission-line-1{font-size:18px}
  .mission-punch{font-size:20px}
  .values-grid{grid-template-columns:1fr;gap:12px}
  .catmap-grid{grid-template-columns:repeat(2,1fr)}
  .clr-grid{grid-template-columns:repeat(2,1fr)}
  .fire-card{grid-template-columns:1fr;gap:20px;padding:24px}
  .fire-visual{width:100%;max-width:280px;margin:0 auto}
  .fire-bars{width:100%;max-width:260px}
  .ps-cards{grid-template-columns:1fr;gap:12px}
  .ps-connector{padding:6px 0}
  .ps-plus{transform:rotate(90deg)}
  .ivf-grid{grid-template-columns:1fr;gap:12px}
  .tg-grid{grid-template-columns:repeat(3,1fr)}
  .hss-grid{grid-template-columns:1fr;gap:18px;padding:24px 20px}
  .hss-arrow{transform:rotate(90deg)}
  .rm-row{grid-template-columns:50px 1fr;grid-template-rows:auto auto;gap:8px 12px;padding:16px 18px}
  .rm-num{grid-row:span 2;font-size:32px}
  .rm-equal{display:none}
  .rm-result{font-size:14px}
  .bargain-card{padding:28px 24px}
  .bargain-title{font-size:24px}
  .bargain-header{flex-wrap:wrap}
  .recguide-body{padding:20px}
  .recguide-row{grid-template-columns:34px 1fr;padding:12px 14px}
}
@media(max-width:600px){
  .catmap-grid{grid-template-columns:1fr}
  .clr-grid{grid-template-columns:1fr}
  .tg-grid{grid-template-columns:repeat(2,1fr)}
  .bargain-stamp{font-size:10px;padding:3px 8px}
}

/* ============================================================
   CONCEPT RENDERERS
============================================================ */
function conceptHTML(c, li, ci){
  const delay = 80 + ci*70;
  let inner = "";
  if(c.type === "callout"){
    inner = `<div class="callout callout-${c.style}"><div class="callout-headline">${esc(c.headline)}</div><div class="callout-body">${nl(c.body)}</div></div>`;
  } else if(c.type === "pullquote"){
    inner = `<div class="pullquote"><div class="pullquote-mark">❝</div><div class="pullquote-text">${esc(c.text)}</div></div>`;
  } else if(c.type === "accordion"){
    const key = li + "-" + ci, open = !!openAcc[key];
    inner = `<div class="accordion ${open?'open':''}">
      <button class="accordion-btn" onclick="toggleAcc('${key}')">
        <div class="accordion-left"><span class="accordion-icon">${c.icon}</span><span class="accordion-headline">${esc(c.headline)}</span></div>
        <div class="accordion-chev">${open?'−':'+'}</div>
      </button>
      <div class="accordion-panel" style="max-height:${open?'3000px':'0'}"><div class="accordion-body">${nl(c.body)}</div></div>
    </div>`;
  } else if(c.type === "path-picker"){
    inner = pathPickerHTML();
  }
  return `<div class="concept-wrap reveal" style="animation-delay:${delay}ms">${inner}</div>`;
}

function pathPickerHTML(){
  const p = pathOptions.find(o=>o.id===picked);
  return `<div class="pathpicker">
    <div class="pp-question"><div class="pp-q-badge">✦ Your quiz result</div><div class="pp-q-text">Which path did the quiz give you?</div></div>
    <div class="pp-options">${pathOptions.map((o,i)=>`<button class="pp-option reveal ${picked===o.id?'picked':''}" style="animation-delay:${150+i*120}ms" onclick="pickPath('${o.id}')"><div class="pp-option-text">${o.question}</div><div class="pp-option-arrow">→</div></button>`).join("")}</div>
    ${p ? `<div class="pp-result">
      <div class="pp-result-eyebrow">Your path →</div>
      <div class="pp-result-name">${esc(p.path)}</div>
      <div class="pp-result-tier">Lives in <strong>the Glow Up classroom</strong>, free</div>
      <div class="pp-result-points">${p.whyPoints.map(w=>`<div class="pp-result-point"><span class="pp-point-dot">✦</span><span>${esc(w)}</span></div>`).join("")}</div>
      <div class="pp-result-free">The gem to grab</div>
      ${gemLinks(p.gems)}
      <div class="pp-result-inside">
        <div class="pp-result-inside-lbl">Where it goes deeper · inside Spiritual Business Skool</div>
        <div class="pp-result-inside-name">${esc(p.inside.name)}</div>
        <div class="pp-result-inside-desc">${esc(p.inside.desc)} <a href="${LINKS.plans}" target="_blank" rel="noopener noreferrer">See the plans →</a></div>
      </div>
      <a class="pp-result-cta" href="${LINKS.classroom}" target="_blank" rel="noopener noreferrer" style="display:block;text-decoration:none">${esc(p.cta)}</a>
    </div>` : ""}
  </div>`;
}

/* ============================================================
   PANES
============================================================ */
function overviewPane(L){
  return `<div class="pane">
    <div class="lesson-desc reveal" style="animation-delay:80ms">${esc(L.overview.desc)}</div>
    ${L.overview.hero ? `<div class="hero-callout reveal" style="animation-delay:200ms"><div class="hero-mark">"</div><div class="hero-text">${esc(L.overview.hero)}</div></div>` : ""}
    ${(L.overview.blocks||[]).map(b => blocks[b] ? blocks[b]() : "").join("")}
  </div>`;
}
function conceptsPane(L){
  return `<div class="pane">${L.concepts.map((c,i)=>conceptHTML(c,L.id,i)).join("")}</div>`;
}
function actionsPane(L){
  return `<div class="pane actions-pane">
    <div class="actions-lead reveal" style="animation-delay:60ms"><div class="actions-lead-badge">Do this today</div><div class="actions-lead-text">These are the small moves that compound. Don't skip. This is where momentum starts.</div></div>
    ${L.actions.map((a,i)=>`<div class="action-card reveal" style="animation-delay:${120+i*90}ms"><div class="action-num">${String(i+1).padStart(2,"0")}</div><div class="action-text">${linkify(a)}</div></div>`).join("")}
  </div>`;
}
function promptPane(L){
  return `<div class="pane">
    <div class="prompt-intro reveal" style="animation-delay:60ms">Paste this into Claude and fill in the brackets. You'll get your custom output in under a minute.</div>
    <div class="prompt-box reveal" style="animation-delay:160ms">
      <div class="prompt-hdr"><span class="prompt-badge">Copy-paste into Claude →</span><button class="prompt-copy-btn" id="prompt-copy-btn" onclick="copyPrompt()">📋 Copy Prompt</button></div>
      <div class="prompt-text" id="prompt-text">${esc(L.prompt)}</div>
    </div>
  </div>`;
}

/* ============================================================
   MAIN RENDER
============================================================ */
function render(){
  const L = lessons[cur];
  const doneCount = Object.values(done).filter(Boolean).length;
  const pct = Math.round(doneCount / lessons.length * 100);
  const tabs = [["overview","Overview","✦"],["concepts","Key Concepts","💎"],["actions","Do This","🌟"]];
  if(L.prompt) tabs.push(["prompt","Prompt","✨"]);
  const titleHTML = (L.accent && L.title.includes(L.accent))
    ? esc(L.title.split(L.accent)[0]) + `<span class="accent-gradient">${esc(L.accent)}</span>` + esc(L.title.split(L.accent)[1])
    : esc(L.title);
  const next = lessons[cur+1];

  const stars = Array.from({length:55},(_,i)=>{
    const v=["","lg","pink","cyan","mint"][i%5];
    return `<div class="s-star ${v}" style="left:${(37*i)%100}%;top:${(53*i)%100}%;animation-delay:${((0.17*i)%4).toFixed(2)}s;animation-duration:${3+i%4}s"></div>`;
  }).join("");

  document.getElementById("root").innerHTML = `
<div class="app">
  <div class="stars-bg">${stars}</div>
  <div class="topbar">
    <div class="topbar-left">
      <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
      <div class="topbar-icon">✦</div>
      <div class="topbar-title">Glow Up with Amanda · <em>Start Here</em></div>
    </div>
    <div class="topbar-nav"><a class="topbar-link active" href="${LINKS.classroom}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Classroom</a></div>
  </div>
  <div class="layout">
    <div class="sidebar-overlay ${mobileOpen?'show':''}" onclick="toggleSidebar(false)"></div>
    <div class="sidebar ${mobileOpen?'open':''}">
      <div class="side-header">
        <div class="side-eyebrow">✦ Start Here</div>
        <div class="side-title">Glow Up with Amanda · Start Here</div>
        <div class="side-prog-row"><div class="side-prog-bg"><div class="side-prog-fill" style="width:${pct}%"></div></div><div class="side-prog-pct">${pct}%</div></div>
      </div>
      <div class="side-list">${lessons.map((l,i)=>`
        <div class="side-item ${cur===i?'active':''}" onclick="selectLesson(${i})">
          <div class="side-check ${done[i]?'done':'pending'}">${done[i]?'<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L5.5 10.5L11.5 3.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
          <div class="side-item-emoji">${l.emoji}</div>
          <div class="side-item-title">${esc(l.title)}</div>
        </div>`).join("")}
      </div>
    </div>
    <div class="main" id="main">
      <div class="main-inner">
        <div class="lesson-meta-row reveal" style="animation-delay:40ms">
          <div class="lesson-num-badge">Day ${L.id+1} of ${lessons.length} · ${L.dur}</div>
          <div class="lesson-mode-chip ${L.hasVideo?'has-video':'quick-day'}">${L.hasVideo?'🎬 Video lesson':'⚡ Quick day · take action'}</div>
        </div>
        <div class="lesson-top reveal" style="animation-delay:120ms">
          <div class="lesson-title"><span class="lesson-emoji">${L.emoji}</span> ${titleHTML}</div>
          <div class="lesson-top-actions"><button class="lesson-done-top ${done[cur]?'complete':'pending'}" onclick="toggleDone(${cur})">${done[cur]?'✦ Completed':'○ Mark Complete'}</button></div>
        </div>
        <div class="tabs reveal" style="animation-delay:200ms">${tabs.map(t=>`<button class="tab ${tab===t[0]?'active':''}" onclick="setTab('${t[0]}')"><span class="tab-icon">${t[2]}</span><span class="tab-label">${t[1]}</span></button>`).join("")}</div>
        ${L.launchLink ? `<a class="launch-link reveal" href="${L.launchLink.url}" target="_blank" rel="noopener noreferrer" style="animation-delay:240ms"><span class="ll-emoji">${L.launchLink.emoji}</span><span class="ll-text"><span class="ll-title">${esc(L.launchLink.label)}</span><span class="ll-sub">${esc(L.launchLink.sub)}</span></span><span class="ll-arrow">→</span></a>` : ""}
        <div class="tab-content">
          ${tab==="overview"?overviewPane(L):tab==="concepts"?conceptsPane(L):tab==="actions"?actionsPane(L):promptPane(L)}
        </div>
        <div class="lesson-bottom reveal" style="animation-delay:600ms">
          <button class="bottom-done-btn ${done[cur]?'complete':'pending'}" onclick="toggleDone(${cur})">${done[cur]?'✦ Lesson Complete':'✎ Mark Lesson Complete'}</button>
          ${next ? `<button class="bottom-next" onclick="selectLesson(${cur+1})">Next: ${esc(next.title)} →</button>` : `<a class="bottom-next" href="${LINKS.plans}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">See what's inside Spiritual Business Skool →</a>`}
        </div>
        <div class="lesson-footer">
          <div class="lf-brand">✦ Glow Up with <em>Amanda</em> ✦</div>
          <div class="lf-links"><a href="${LINKS.glowup}" target="_blank" rel="noopener noreferrer">Glow Up with Amanda</a> · <a href="${LINKS.classroom}" target="_blank" rel="noopener noreferrer">Classroom</a> · <a href="${LINKS.playbook}" target="_blank" rel="noopener noreferrer">A to Z Playbook</a> · <a href="${LINKS.plans}" target="_blank" rel="noopener noreferrer">Spiritual Business Skool</a></div>
          <div class="lf-credit">Glow Up with Amanda · Start Here · The free side of Spiritual Business Skool</div>
        </div>
      </div>
    </div>
  </div>
</div>`;
}

/* ============================================================
   ACTIONS
============================================================ */
function selectLesson(i){ cur = i; tab = "overview"; picked = null; mobileOpen = false; render(); scrollTop(); }
function setTab(t){ tab = t; render(); }
function toggleSidebar(force){ mobileOpen = (typeof force === "boolean") ? force : !mobileOpen; render(); }
function toggleAcc(key){ openAcc[key] = !openAcc[key]; render(); }
function pickPath(id){ picked = (picked === id) ? null : id; render(); }
function scrollTop(){ const m = document.getElementById("main"); if(m) m.scrollTop = 0; }
function toggleDone(i){
  const was = done[i];
  done[i] = !was;
  render();
  if(!was) celebrate();
}
function celebrate(){
  const c = document.createElement("div");
  c.className = "celebration";
  c.innerHTML = Array.from({length:24},(_,i)=>`<div class="celeb-spark" style="left:${45+Math.random()*10}%;top:${40+Math.random()*10}%;animation-delay:${i*30}ms;transform:rotate(${i*15}deg) translateY(-${80+Math.random()*80}px)"></div>`).join("");
  document.body.appendChild(c);
  setTimeout(()=>c.remove(), 1800);
}
function copyPrompt(){
  const txt = lessons[cur].prompt || "";
  const ok = () => { const b = document.getElementById("prompt-copy-btn"); if(b){ b.textContent = "✦ Copied!"; setTimeout(()=>{ b.textContent = "📋 Copy Prompt"; }, 2000); } };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt, ok)); }
  else fallbackCopy(txt, ok);
}
function fallbackCopy(txt, ok){
  try{ const ta=document.createElement("textarea"); ta.value=txt; ta.style.cssText="position:fixed;left:-9999px;top:-9999px;opacity:0"; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); ok(); }catch(e){ console.error("Copy failed", e); }
}

render();
requestAnimationFrame(()=>{ const e=document.getElementById("loading"); if(e){ e.classList.add("hidden"); setTimeout(()=>e.remove(),450); } });
</script>
